<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parolni tiklash — Yashnar English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Top Nav -->
  <header class="auth-nav">
    <a href="/" class="auth-brand">
      <span class="auth-brand-dot"></span>
      <span>Yashnar English</span>
    </a>
    <a href="/login" class="auth-nav-link">← Tizimga kirishga qaytish</a>
  </header>

  <!-- Auth Card Center -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Parolni tiklash</h1>
        <p class="auth-subtitle">Profilingizga biriktirilgan elektron pochta manzilini kiriting. Biz sizga xavfsiz tiklash ko'rsatmalarini taqdim etamiz.</p>
      </div>

      <!-- Alert Banner -->
      <div class="auth-alert" id="auth-alert" hidden></div>

      <!-- Step 1: Request Reset Form -->
      <form class="auth-form" id="forgot-request-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Elektron pochta manzilingiz</label>
          <input type="email" class="form-input" id="forgot-email" placeholder="misol@domain.uz" autocomplete="email" required>
        </div>

        <button type="submit" class="btn-auth-submit" id="btn-forgot-request-submit">
          Tiklash havolasini yuborish
        </button>
      </form>

      <!-- Step 2: Set New Password Form (Revealed when token is present) -->
      <form class="auth-form" id="forgot-reset-form" hidden>
        <input type="hidden" id="reset-token-input">

        <div class="form-group">
          <label class="form-label" for="reset-new-password">Yangi parol (kamida 8 ta belgi, harf va raqam)</label>
          <input type="password" class="form-input" id="reset-new-password" placeholder="Yangi parol kiriting" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-password">Yangi parolni tasdiqlang</label>
          <input type="password" class="form-input" id="reset-confirm-password" placeholder="Yangi parolni qayta kiriting" required>
        </div>

        <button type="submit" class="btn-auth-submit" id="btn-forgot-reset-submit">
          Yangi parolni saqlash
        </button>
      </form>

      <div class="auth-footer">
        Parolni esladingizmi? <a href="/login">Tizimga kiring</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.YashnarAuth.initForgotPasswordForm();
    });
  </script>
</body>
</html>
